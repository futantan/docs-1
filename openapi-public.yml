openapi: 3.1.0
info:
  title: E2B API
  version: 0.1.0
  description: Complete E2B developer API. Platform endpoints are served on api.e2b.app.
    Sandbox endpoints (envd) are served on {port}-{sandboxID}.e2b.app.
servers:
- url: https://api.e2b.app
  description: E2B Platform API
- &id001
  url: https://{port}-{sandboxID}.e2b.app
  description: Sandbox API (envd) — runs inside each sandbox
  variables:
    port:
      default: '49983'
      description: Port number
    sandboxID:
      default: sandbox-id
      description: Sandbox identifier
paths:
  /health:
    get:
      description: Health check
      responses:
        '200':
          description: Request was successful
        '401':
          $ref: '#/components/responses/401'
    servers:
    - *id001
  /metrics:
    get:
      summary: Get the stats of the service
      security:
      - AccessTokenAuth: []
      - {}
      responses:
        '200':
          description: The resource usage metrics of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
    servers:
    - *id001
  /init:
    post:
      summary: Set initial vars, ensure the time and metadata is synced with the host
      security:
      - AccessTokenAuth: []
      - {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                volumeMounts:
                  type: array
                  items:
                    $ref: '#/components/schemas/VolumeMount'
                hyperloopIP:
                  type: string
                  description: IP address of the hyperloop server to connect to
                envVars:
                  $ref: '#/components/schemas/EnvVars'
                accessToken:
                  type: string
                  description: Access token for secure access to envd service
                  x-go-type: SecureToken
                timestamp:
                  type: string
                  format: date-time
                  description: The current timestamp in RFC3339 format
                defaultUser:
                  type: string
                  description: The default user to use for operations
                defaultWorkdir:
                  type: string
                  description: The default working directory to use for operations
      responses:
        '204':
          description: Env vars set, the time and metadata is synced with the host
    servers:
    - *id001
  /envs:
    get:
      summary: Get the environment variables
      security:
      - AccessTokenAuth: []
      - {}
      responses:
        '200':
          description: Environment variables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVars'
    servers:
    - *id001
  /files:
    get:
      summary: Download a file
      tags:
      - files
      security:
      - AccessTokenAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/User'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/SignatureExpiration'
      responses:
        '200':
          $ref: '#/components/responses/DownloadSuccess'
        '401':
          $ref: '#/components/responses/InvalidUser'
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Upload a file and ensure the parent directories exist. If the file
        exists, it will be overwritten.
      tags:
      - files
      security:
      - AccessTokenAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/User'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/SignatureExpiration'
      requestBody:
        $ref: '#/components/requestBodies/File'
      responses:
        '200':
          $ref: '#/components/responses/UploadSuccess'
        '400':
          $ref: '#/components/responses/InvalidPath'
        '401':
          $ref: '#/components/responses/InvalidUser'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '507':
          $ref: '#/components/responses/NotEnoughDiskSpace'
    servers:
    - *id001
  /filesystem.Filesystem/CreateWatcher:
    post:
      tags:
      - filesystem.Filesystem
      summary: CreateWatcher
      description: Non-streaming versions of WatchDir
      operationId: filesystem.Filesystem.CreateWatcher
      parameters:
      - name: Connect-Protocol-Version
        in: header
        required: true
