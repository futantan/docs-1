          $ref: '#/components/schemas/Sandboxprocess.PTY.Size'
      title: PTY
      additionalProperties: false
    Sandboxprocess.PTY.Size:
      type: object
      properties:
        cols:
          type: integer
          title: cols
        rows:
          type: integer
          title: rows
      title: Size
      additionalProperties: false
    Sandboxprocess.ProcessConfig:
      type: object
      properties:
        cmd:
          type: string
          title: cmd
        args:
          type: array
          items:
            type: string
          title: args
        envs:
          type: object
          title: envs
          additionalProperties:
            type: string
            title: value
        cwd:
          type: string
          title: cwd
      title: ProcessConfig
      additionalProperties: false
    Sandboxprocess.ProcessConfig.EnvsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: EnvsEntry
      additionalProperties: false
    Sandboxprocess.ProcessEvent:
      type: object
      oneOf:
        - properties:
            data:
              title: data
              $ref: '#/components/schemas/Sandboxprocess.ProcessEvent.DataEvent'
          title: data
          required:
            - data
        - properties:
            end:
              title: end
              $ref: '#/components/schemas/Sandboxprocess.ProcessEvent.EndEvent'
          title: end
          required:
            - end
        - properties:
            keepalive:
              title: keepalive
              $ref: '#/components/schemas/Sandboxprocess.ProcessEvent.KeepAlive'
          title: keepalive
          required:
            - keepalive
        - properties:
            start:
              title: start
              $ref: '#/components/schemas/Sandboxprocess.ProcessEvent.StartEvent'
          title: start
          required:
            - start
      title: ProcessEvent
      additionalProperties: false
    Sandboxprocess.ProcessEvent.DataEvent:
      type: object
      oneOf:
        - properties:
            pty:
              type: string
              title: pty
              format: byte
          title: pty
          required:
            - pty
        - properties:
            stderr:
              type: string
              title: stderr
              format: byte
          title: stderr
          required:
            - stderr
        - properties:
            stdout:
              type: string
              title: stdout
              format: byte
          title: stdout
          required:
            - stdout
      title: DataEvent
      additionalProperties: false
    Sandboxprocess.ProcessEvent.EndEvent:
      type: object
      properties:
        exitCode:
          type: integer
          title: exit_code
          format: int32
        exited:
          type: boolean
          title: exited
        status:
          type: string
          title: status
        error:
          type: string
          title: error
      title: EndEvent
      additionalProperties: false
    Sandboxprocess.ProcessEvent.KeepAlive:
      type: object
      title: KeepAlive
      additionalProperties: false
    Sandboxprocess.ProcessEvent.StartEvent:
      type: object
      properties:
        pid:
          type: integer
          title: pid
      title: StartEvent
      additionalProperties: false
    Sandboxprocess.ProcessInfo:
      type: object
      properties:
        config:
          title: config
          $ref: '#/components/schemas/Sandboxprocess.ProcessConfig'
        pid:
          type: integer
          title: pid
        tag:
          type: string
          title: tag
      title: ProcessInfo
      additionalProperties: false
    Sandboxprocess.ProcessInput:
      type: object
      oneOf:
        - properties:
            pty:
              type: string
              title: pty
              format: byte
          title: pty
          required:
            - pty
        - properties:
            stdin:
              type: string
              title: stdin
              format: byte
          title: stdin
          required:
            - stdin
      title: ProcessInput
      additionalProperties: false
    Sandboxprocess.ProcessSelector:
      type: object
      oneOf:
        - properties:
            pid:
              type: integer
              title: pid
          title: pid
          required:
            - pid
        - properties:
            tag:
              type: string
              title: tag
          title: tag
          required:
            - tag
      title: ProcessSelector
      additionalProperties: false
    Sandboxprocess.SendInputRequest:
      type: object
      properties:
        process:
          title: process
          $ref: '#/components/schemas/Sandboxprocess.ProcessSelector'
        input:
          title: input
          $ref: '#/components/schemas/Sandboxprocess.ProcessInput'
      title: SendInputRequest
      additionalProperties: false
    Sandboxprocess.SendInputResponse:
      type: object
      title: SendInputResponse
      additionalProperties: false
    Sandboxprocess.SendSignalRequest:
      type: object
      properties:
        process:
          title: process
          $ref: '#/components/schemas/Sandboxprocess.ProcessSelector'
        signal:
          title: signal
          $ref: '#/components/schemas/Sandboxprocess.Signal'
      title: SendSignalRequest
      additionalProperties: false
    Sandboxprocess.SendSignalResponse:
      type: object
      title: SendSignalResponse
      additionalProperties: false
    Sandboxprocess.Signal:
      type: string
      title: Signal
      enum:
        - SIGNAL_UNSPECIFIED
        - SIGNAL_SIGTERM
        - SIGNAL_SIGKILL
    Sandboxprocess.StartRequest:
      type: object
      properties:
        process:
          title: process
          $ref: '#/components/schemas/Sandboxprocess.ProcessConfig'
        pty:
          title: pty
          nullable: true
          $ref: '#/components/schemas/Sandboxprocess.PTY'
        tag:
          type: string
          title: tag
        stdin:
          type: boolean
          title: stdin
          description: |-
            This is optional for backwards compatibility.
             We default to true. New SDK versions will set this to false by default.
      title: StartRequest
      additionalProperties: false
    Sandboxprocess.StartResponse:
      type: object
      properties:
        event:
          title: event
          $ref: '#/components/schemas/Sandboxprocess.ProcessEvent'
      title: StartResponse
      additionalProperties: false
    Sandboxprocess.StreamInputRequest:
      type: object
      oneOf:
        - properties:
            data:
              title: data
              $ref: '#/components/schemas/Sandboxprocess.StreamInputRequest.DataEvent'
          title: data
          required:
            - data
        - properties:
            keepalive:
              title: keepalive
              $ref: '#/components/schemas/Sandboxprocess.StreamInputRequest.KeepAlive'
          title: keepalive
          required:
            - keepalive
        - properties:
            start:
              title: start
              $ref: '#/components/schemas/Sandboxprocess.StreamInputRequest.StartEvent'
          title: start
          required:
            - start
      title: StreamInputRequest
      additionalProperties: false
    Sandboxprocess.StreamInputRequest.DataEvent:
      type: object
      properties:
        input:
          title: input
          $ref: '#/components/schemas/Sandboxprocess.ProcessInput'
      title: DataEvent
      additionalProperties: false
    Sandboxprocess.StreamInputRequest.KeepAlive:
      type: object
      title: KeepAlive
      additionalProperties: false
    Sandboxprocess.StreamInputRequest.StartEvent:
      type: object
      properties:
        process:
          title: process
          $ref: '#/components/schemas/Sandboxprocess.ProcessSelector'
      title: StartEvent
      additionalProperties: false
    Sandboxprocess.StreamInputResponse:
      type: object
      title: StreamInputResponse
      additionalProperties: false
    Sandboxprocess.UpdateRequest:
      type: object
      properties:
        process:
          title: process
          $ref: '#/components/schemas/Sandboxprocess.ProcessSelector'
        pty:
          title: pty
          nullable: true
          $ref: '#/components/schemas/Sandboxprocess.PTY'
      title: UpdateRequest
      additionalProperties: false
    Sandboxprocess.UpdateResponse:
      type: object
      title: UpdateResponse
      additionalProperties: false
  requestBodies:
    SandboxFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
tags:
  - name: templates
  - name: sandboxes
  - name: auth
  - name: access-tokens
  - name: api-keys
  - name: tags
  - name: Sandbox
    description: Sandbox initialization
  - name: Sandbox Files
    description: Upload and download files in sandbox
  - name: Sandbox Filesystem
    description: Filesystem operations (list, create, move, delete)
  - name: Sandbox Process
    description: Process management (start, stop, send input)
paths:
  /teams/{teamID}/metrics:
    get:
      description: Get metrics for the team
      tags:
        - auth
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/teamID'
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Unix timestamp for the start of the interval, in seconds, for which the metrics
        - in: query
          name: end
          schema:
            type: integer
            format: int64
            minimum: 0
            description: Unix timestamp for the end of the interval, in seconds, for which the metrics
      responses:
        '200':
          description: Successfully returned the team metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMetric'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /teams/{teamID}/metrics/max:
    get:
      description: Get the maximum metrics for the team in the given interval
      tags:
        - auth
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/teamID'
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Unix timestamp for the start of the interval, in seconds, for which the metrics
        - in: query
          name: end
          schema:
            type: integer
            format: int64
            minimum: 0
            description: Unix timestamp for the end of the interval, in seconds, for which the metrics
        - in: query
          name: metric
          required: true
          schema:
            type: string
            enum:
              - concurrent_sandboxes
              - sandbox_start_rate
          description: Metric to retrieve the maximum value for
      responses:
        '200':
          description: Successfully returned the team metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaxTeamMetric'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes:
    get:
      description: List all running sandboxes
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - name: metadata
          in: query
          description: Metadata query used to filter the sandboxes (e.g. "user=abc&app=prod"). Each key and values must be URL encoded.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successfully returned all running sandboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ListedSandbox'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    post:
      description: Create a sandbox from the template
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSandbox'
      responses:
        '201':
          description: The sandbox was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /v2/sandboxes:
    get:
      description: List all sandboxes
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - name: metadata
          in: query
          description: Metadata query used to filter the sandboxes (e.g. "user=abc&app=prod"). Each key and values must be URL encoded.
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: Filter sandboxes by one or more states
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SandboxState'
          style: form
          explode: false
        - $ref: '#/components/parameters/paginationNextToken'
        - $ref: '#/components/parameters/paginationLimit'
      responses:
        '200':
          description: Successfully returned all running sandboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ListedSandbox'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/metrics:
    get:
      description: List metrics for given sandboxes
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - name: sandbox_ids
          in: query
          required: true
          description: Comma-separated list of sandbox IDs to get metrics for
          explode: false
          schema:
            type: array
            items:
              type: string
            maxItems: 100
            uniqueItems: true
      responses:
        '200':
          description: Successfully returned all running sandboxes with metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxesWithMetrics'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/logs:
    get:
      description: Get sandbox logs
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/sandboxID'
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Starting timestamp of the logs that should be returned in milliseconds
        - in: query
          name: limit
          schema:
            default: 1000
            format: int32
            minimum: 0
            type: integer
          description: Maximum number of logs that should be returned
      responses:
        '200':
          description: Successfully returned the sandbox logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLogs'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}:
    get:
      description: Get a sandbox by id
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/sandboxID'
      responses:
        '200':
          description: Successfully returned the sandbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxDetail'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      description: Kill a sandbox
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/sandboxID'
      responses:
        '204':
          description: The sandbox was killed successfully
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/metrics:
    get:
      description: Get sandbox metrics
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/sandboxID'
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Unix timestamp for the start of the interval, in seconds, for which the metrics
        - in: query
          name: end
          schema:
            type: integer
            format: int64
            minimum: 0
            description: Unix timestamp for the end of the interval, in seconds, for which the metrics
      responses:
        '200':
          description: Successfully returned the sandbox metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxMetric'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/pause:
    post:
      description: Pause the sandbox
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/sandboxID'
      responses:
        '204':
          description: The sandbox was paused successfully and can be resumed
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/resume:
    post:
      deprecated: true
      description: Resume the sandbox
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/sandboxID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumedSandbox'
      responses:
        '201':
          description: The sandbox was resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/connect:
    post:
      description: Returns sandbox details. If the sandbox is paused, it will be resumed. TTL is only extended.
      tags:
        - sandboxes
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/sandboxID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectSandbox'
      responses:
        '200':
          description: The sandbox was already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '201':
          description: The sandbox was resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/timeout:
    post:
      description: Set the timeout for the sandbox. The sandbox will expire x seconds from the time of the request. Calling this method multiple times overwrites the TTL, each time using the current timestamp as the starting point to measure the timeout duration.
      security:
        - ApiKeyAuth: []
      tags:
        - sandboxes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - timeout
              properties:
                timeout:
                  description: Timeout in seconds from the current time after which the sandbox should expire
                  type: integer
                  format: int32
                  minimum: 0
      parameters:
        - $ref: '#/components/parameters/sandboxID'
      responses:
        '204':
          description: Successfully set the sandbox timeout
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/refreshes:
    post:
      description: Refresh the sandbox extending its time to live
      security:
        - ApiKeyAuth: []
      tags:
        - sandboxes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  description: Duration for which the sandbox should be kept alive in seconds
                  type: integer
                  maximum: 3600
                  minimum: 0
      parameters:
        - $ref: '#/components/parameters/sandboxID'
      responses:
        '204':
          description: Successfully refreshed the sandbox
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
  /v3/templates:
    post:
      description: Create a new template
      tags:
        - templates
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateBuildRequestV3'
      responses:
        '202':
          description: The build was requested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRequestResponseV3'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /v2/templates:
    post:
      description: Create a new template
      deprecated: true
      tags:
        - templates
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateBuildRequestV2'
      responses:
        '202':
          description: The build was requested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateLegacy'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /templates/{templateID}/files/{hash}:
    get:
      description: Get an upload link for a tar file containing build layer files
      tags:
        - templates
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/templateID'
        - in: path
          name: hash
          required: true
          schema:
            type: string
            description: Hash of the files
      responses:
        '201':
          description: The upload link where to upload the tar file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateBuildFileUpload'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /templates:
    get:
      description: List all templates
      tags:
        - templates
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          required: false
          name: teamID
          schema:
            type: string
            description: Identifier of the team
      responses:
        '200':
          description: Successfully returned all templates
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /templates/{templateID}:
    get:
      description: List all builds for a template
      tags:
        - templates
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/templateID'
        - $ref: '#/components/parameters/paginationNextToken'
        - $ref: '#/components/parameters/paginationLimit'
      responses:
        '200':
          description: Successfully returned the template with its builds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateWithBuilds'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    delete:
      description: Delete a template
      tags:
        - templates
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/templateID'
      responses:
        '204':
          description: The template was deleted successfully
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    patch:
      description: Update template
      deprecated: true
      tags:
        - templates
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/templateID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdateRequest'
      responses:
        '200':
          description: The template was updated successfully
        '400':
