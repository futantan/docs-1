                      type: object
                      properties:
                        pid:
                          type: string
                        cmd:
                          type: string
  /process.Process/SendSignal:
    servers:
    - url: https://{port}-{sandboxId}.e2b.app
      description: Sandbox Data Plane API
      variables:
        port:
          default: '49982'
          description: API port (always 49982)
        sandboxId:
          default: your-sandbox-id
          description: Your sandbox ID from the create response
    post:
      summary: Send a signal to a process
      description: |
        Sends a Unix signal to a process. Common signals:
        - `SIGTERM` (15): Request graceful termination
        - `SIGKILL` (9): Force immediate termination
        - `SIGINT` (2): Interrupt (like Ctrl+C)
      operationId: sendSignal
      tags:
      - Sandbox Process
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pid
              - signal
              properties:
                pid:
                  type: string
                  description: Process ID
                signal:
                  type: integer
                  description: Signal number (e.g., 9 for SIGKILL, 15 for SIGTERM)
                  example: 15
      responses:
        '200':
          description: Signal sent
  /process.Process/SendInput:
    servers:
    - url: https://{port}-{sandboxId}.e2b.app
      description: Sandbox Data Plane API
      variables:
        port:
          default: '49982'
          description: API port (always 49982)
        sandboxId:
          default: your-sandbox-id
