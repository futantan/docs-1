                  example: /home/user/file.txt
      responses:
        '200':
          description: File information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                    enum:
                    - file
                    - dir
                  size:
                    type: integer
                    format: int64
                  permissions:
                    type: string
  /filesystem.Filesystem/CreateWatcher:
    servers:
    - url: https://{port}-{sandboxId}.e2b.app
      description: Sandbox Data Plane API
      variables:
        port:
          default: '49982'
          description: API port (always 49982)
        sandboxId:
          default: your-sandbox-id
          description: Your sandbox ID from the create response
    post:
      summary: Create a filesystem watcher
      description: |
        Creates a watcher that monitors a directory for changes. Use
        `GetWatcherEvents` to poll for events. This is the non-streaming
        alternative to `WatchDir`.
      operationId: createWatcher
      tags:
      - Sandbox Filesystem
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  type: string
                  description: Directory path to watch
                  example: /home/user/project
      responses:
        '200':
          description: Watcher created
          content:
            application/json:
              schema:
                type: object
                properties:
                  watcherID:
                    type: string
                    description: ID to use with GetWatcherEvents and RemoveWatcher
  /filesystem.Filesystem/GetWatcherEvents:
    servers:
    - url: https://{port}-{sandboxId}.e2b.app
      description: Sandbox Data Plane API
      variables:
        port:
          default: '49982'
          description: API port (always 49982)
        sandboxId:
          default: your-sandbox-id
          description: Your sandbox ID from the create response
    post:
      summary: Get filesystem watcher events
      description: |
        Retrieves pending filesystem change events from a watcher created
        with `CreateWatcher`. Returns events since the last poll.
      operationId: getWatcherEvents
      tags:
      - Sandbox Filesystem
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - watcherID
              properties:
                watcherID:
                  type: string
                  description: Watcher ID from CreateWatcher
      responses:
        '200':
          description: Watcher events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - create
                          - write
                          - remove
                          - rename
                        path:
                          type: string
  /filesystem.Filesystem/RemoveWatcher:
    servers:
    - url: https://{port}-{sandboxId}.e2b.app
      description: Sandbox Data Plane API
      variables:
        port:
          default: '49982'
          description: API port (always 49982)
        sandboxId:
          default: your-sandbox-id
          description: Your sandbox ID from the create response
    post:
      summary: Remove a filesystem watcher
      description: |
        Stops and removes a filesystem watcher. No more events will be
        generated after this call.
      operationId: removeWatcher
      tags:
      - Sandbox Filesystem
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - watcherID
              properties:
                watcherID:
                  type: string
                  description: Watcher ID to remove
      responses:
        '200':
          description: Watcher removed
  /filesystem.Filesystem/WatchDir:
    servers:
    - url: https://{port}-{sandboxId}.e2b.app
      description: Sandbox Data Plane API
      variables:
        port:
          default: '49982'
          description: API port (always 49982)
        sandboxId:
          default: your-sandbox-id
          description: Your sandbox ID from the create response
    post:
      summary: Watch directory (streaming)
      description: |
        Streams filesystem change events for a directory in real-time.
        This is the streaming alternative to CreateWatcher + GetWatcherEvents.

        Uses server-sent events (SSE) to push changes as they happen.
      operationId: watchDir
      tags:
      - Sandbox Filesystem
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  type: string
                  description: Directory path to watch
                  example: /home/user/project
      responses:
        '200':
          description: Stream of filesystem events
  /process.Process/Start:
    servers:
    - url: https://{port}-{sandboxId}.e2b.app
      description: Sandbox Data Plane API
      variables:
        port:
          default: '49982'
          description: API port (always 49982)
        sandboxId:
          default: your-sandbox-id
          description: Your sandbox ID from the create response
    post:
      summary: Start a process
      description: |
        Starts a new process in the sandbox. Returns a process ID that can be
        used to monitor, send input to, or terminate the process.

        **Example - Run a Python script:**
        ```json
        {
          "cmd": "python",
          "args": ["script.py"],
          "cwd": "/home/user",
          "envVars": {
            "PYTHONPATH": "/home/user/lib"
          }
        }
        ```

        **Example - Run a shell command:**
        ```json
        {
          "cmd": "/bin/bash",
          "args": ["-c", "echo 'Hello World' && sleep 5"]
        }
        ```
      operationId: startProcess
      tags:
      - Sandbox Process
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cmd
              properties:
                cmd:
                  type: string
                  description: Command to execute
                  example: python
                args:
                  type: array
                  items:
                    type: string
                  description: Command arguments
                  example:
                  - script.py
                  - --verbose
                cwd:
                  type: string
                  description: Working directory
                  example: /home/user
                envVars:
                  type: object
                  additionalProperties:
                    type: string
                  description: Environment variables
                  example:
                    NODE_ENV: production
      responses:
        '200':
          description: Process started
          content:
            application/json:
              schema:
                type: object
                properties:
                  pid:
                    type: string
                    description: Process ID for subsequent operations
  /process.Process/List:
    servers:
    - url: https://{port}-{sandboxId}.e2b.app
      description: Sandbox Data Plane API
      variables:
        port:
          default: '49982'
          description: API port (always 49982)
        sandboxId:
          default: your-sandbox-id
          description: Your sandbox ID from the create response
    post:
      summary: List running processes
      description: Returns a list of all processes currently running in the sandbox.
      operationId: listProcesses
      tags:
      - Sandbox Process
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: List of processes
          content:
            application/json:
              schema:
                type: object
                properties:
                  processes:
                    type: array
