    post:
      summary: Connect to or resume a sandbox
      description: |-
        Returns sandbox connection details. If the sandbox is paused, it will
        be automatically resumed.

        Use this endpoint to:
        - Resume a paused sandbox
        - Get connection details for a running sandbox
        - Extend the sandbox timeout

        **Note:** The timeout is extended from the current time, not added to
        the existing timeout.
      operationId: connectSandbox
      tags:
      - Sandboxes
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/sandboxID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectSandbox'
      responses:
        '200':
          description: The sandbox was already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '201':
          description: The sandbox was resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/timeout:
    post:
      summary: Set sandbox timeout
      description: |-
        Sets a new timeout for the sandbox. The sandbox will automatically
        terminate after the specified number of seconds from now.

        **Note:** This replaces any existing timeout. Each call resets the
        countdown from the current time.
      operationId: setSandboxTimeout
      tags:
      - Sandboxes
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/sandboxID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - timeout
              properties:
                timeout:
                  description: Timeout in seconds from the current time after which the sandbox should expire
                  type: integer
                  format: int32
                  minimum: 0
      responses:
        '204':
          description: Timeout updated successfully
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /sandboxes/{sandboxID}/refreshes:
    post:
      summary: Extend sandbox lifetime
      description: |-
        Extends the sandbox lifetime by the specified duration. Unlike
        `/timeout`, this adds time to the existing expiration.
      operationId: refreshSandbox
      tags:
      - Sandboxes
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/sandboxID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  description: Duration for which the sandbox should be kept alive in seconds
                  type: integer
                  maximum: 3600
                  minimum: 0
      responses:
        '204':
          description: Sandbox lifetime extended
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
